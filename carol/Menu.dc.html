<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Menu lateral</title>
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
  <style>
    * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body { margin: 0; background: #000000; color: #ECEDEE; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }
    .mn-title { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
    @keyframes mn-slide { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    @keyframes mn-fade { from { opacity: 0; } to { opacity: 1; } }
    .mn-item:active { background: rgba(255,255,255,0.06); }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000;">

  <button type="button" aria-label="Fechar menu" onClick="{{close}}" style="position: absolute; inset: 0; width: 390px; height: 844px; padding: 0; border: none; background: rgba(0,0,0,0.62); cursor: pointer; animation: mn-fade .2s ease;"></button>

  <aside aria-label="Menu" onTouchStart="{{tStart}}" onTouchEnd="{{tEnd}}" style="position: absolute; left: 0; top: 0; width: 308px; height: 844px; background: #09090B; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; animation: mn-slide .24s cubic-bezier(.2,.8,.2,1);">

    <div style="flex: none; padding: 30px 22px 18px;">
      <button type="button" aria-label="Abrir meu perfil" onClick="{{goPerfil}}" style="position: relative; width: 64px; height: 64px; padding: 0; border: none; border-radius: 16px; cursor: pointer; display: block; background: transparent; box-shadow: 0 0 0 2px {{accent}};">
        <sc-if value="{{hasCustomAvatar}}" hint-placeholder-val="{{false}}">
          <img src="{{avatarUri}}" alt="" width="64" height="64" style="display: block; border-radius: 16px; image-rendering: pixelated;">
        </sc-if>
        <sc-if value="{{noCustomAvatar}}" hint-placeholder-val="{{true}}">
          <svg width="64" height="64" viewBox="0 0 24 24" shape-rendering="crispEdges" style="display: block; border-radius: 16px;">
            <rect x="0" y="0" width="24" height="24" fill="#1F2A24"></rect>
            <rect x="4" y="2" width="16" height="8" fill="#3E7D5A"></rect>
            <rect x="0" y="6" width="4" height="10" fill="#3E7D5A"></rect>
            <rect x="20" y="6" width="4" height="10" fill="#3E7D5A"></rect>
            <rect x="6" y="8" width="12" height="10" fill="#3E7D5A"></rect>
            <rect x="8" y="12" width="3" height="3" fill="#0B0F0D"></rect>
            <rect x="13" y="12" width="3" height="3" fill="#0B0F0D"></rect>
            <rect x="9" y="17" width="6" height="2" fill="#0B0F0D"></rect>
          </svg>
        </sc-if>
      </button>
      <div class="mn-title" style="margin-top: 12px; font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{name}}</div>
      <div style="margin-top: 2px; font-size: 13.5px; color: #A1A1AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{handle}}</div>

      <div style="position: relative; margin-top: 14px;">
        <button type="button" aria-haspopup="listbox" aria-expanded="{{statusExpanded}}" onClick="{{toggleStatus}}" style="width: 100%; height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: #18181B; color: #ECEDEE; cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left;">
          <span style="flex: none; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;"><sc-if value="{{cur.isOnline}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" style="display: block;"><circle cx="10" cy="10" r="7" fill="#17C964"></circle></svg></sc-if><sc-if value="{{cur.isBusy}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" style="display: block;"><circle cx="10" cy="10" r="7" fill="#F5A524"></circle><rect x="6" y="8.8" width="8" height="2.4" rx="1.2" fill="#09090B"></rect></svg></sc-if><sc-if value="{{cur.isInvis}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" style="display: block;"><circle cx="10" cy="10" r="5.6" fill="none" stroke="#71717A" stroke-width="2.6"></circle></svg></sc-if></span>
          <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 700;">{{cur.label}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; transform: rotate({{chevRot}}deg); transition: transform .15s ease;"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <sc-if value="{{statusOpen}}" hint-placeholder-val="{{false}}">
          <div role="listbox" aria-label="Meu status" style="position: absolute; left: 0; right: 0; top: 46px; z-index: 6; padding: 6px; border-radius: 16px; background: #18181B; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 14px 34px rgba(0,0,0,0.6); animation: mn-fade .12s ease;">
            <sc-for list="{{statuses}}" as="s" hint-placeholder-count="3">
              <button type="button" role="option" aria-selected="{{s.checked}}" onClick="{{s.pick}}" style="{{s.style}}">
                <span style="flex: none; width: 20px; height: 20px; margin-top: 1px; display: flex; align-items: center; justify-content: center;"><sc-if value="{{s.isOnline}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" style="display: block;"><circle cx="10" cy="10" r="7" fill="#17C964"></circle></svg></sc-if><sc-if value="{{s.isBusy}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" style="display: block;"><circle cx="10" cy="10" r="7" fill="#F5A524"></circle><rect x="6" y="8.8" width="8" height="2.4" rx="1.2" fill="#09090B"></rect></svg></sc-if><sc-if value="{{s.isInvis}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" style="display: block;"><circle cx="10" cy="10" r="5.6" fill="none" stroke="#71717A" stroke-width="2.6"></circle></svg></sc-if></span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                  <span style="font-size: 14px; font-weight: 700;">{{s.label}}</span>
                  <span style="font-size: 11.5px; line-height: 1.4; color: #A1A1AA; font-weight: 500;">{{s.desc}}</span>
                </span>
                <sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ECEDEE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>

    <div style="flex: none; height: 1px; margin: 0 22px; background: rgba(255,255,255,0.08);"></div>

    <sc-if value="{{statusOpen}}" hint-placeholder-val="{{false}}">
      <button type="button" aria-label="Fechar lista de status" onClick="{{toggleStatus}}" style="position: absolute; inset: 0; z-index: 5; padding: 0; border: none; background: transparent; cursor: default;"></button>
    </sc-if>

    <nav aria-label="Atalhos" style="flex: 1; min-height: 0; overflow-y: auto; padding: 10px 10px 0;">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
        <button type="button" class="mn-item" onClick="{{it.onClick}}" style="width: 100%; height: 52px; padding: 0 12px; border: none; border-radius: 14px; background: transparent; color: #ECEDEE; cursor: pointer; display: flex; align-items: center; gap: 16px; text-align: left;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="{{it.icon}}"></path></svg>
          <span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 600;">{{it.label}}</span>
          <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}">
            <span style="min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: #F31260; color: #FFFFFF; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{it.badge}}</span>
          </sc-if>
        </button>
      </sc-for>
    </nav>

    <div style="flex: none; height: 1px; margin: 0 22px; background: rgba(255,255,255,0.08);"></div>
    <div style="flex: none; padding: 8px 10px 22px;">
      <button type="button" class="mn-item" onClick="{{logout}}" style="width: 100%; height: 52px; padding: 0 12px; border: none; border-radius: 14px; background: transparent; color: #F31260; cursor: pointer; display: flex; align-items: center; gap: 16px; text-align: left;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 600;">Sair da conta</span>
      </button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#006FEE","options":["#006FEE","#9353D3","#17C964","#F5A524"],"section":"Tema"},"avatarUri":{"editor":null},"name":{"editor":null},"handle":{"editor":null},"presence":{"editor":null},"setPresence":{"editor":null},"notifCount":{"editor":null},"unread":{"editor":null},"close":{"editor":null},"goPerfil":{"editor":null},"goRoom":{"editor":null},"goNotifs":{"editor":null},"goInbox":{"editor":null},"goAvatar":{"editor":null},"goSettings":{"editor":null},"goReviews":{"editor":null},"goForums":{"editor":null},"logout":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { statusOpen: false };
    this._x0 = null;
  }
  call(fn) { return () => { if (typeof fn === 'function') fn(); }; }
  renderVals() {
    const accent = this.props.accent ?? '#006FEE';
    const p = this.props;
    const pres = p.presence || 'online';
    const OPTS = [
      { k: 'online', label: 'Disponível', desc: 'Seus duos veem a bolinha verde quando você está conectado.' },
      { k: 'busy', label: 'Ocupado', desc: 'Seus duos veem que você está ocupado.' },
      { k: 'invisible', label: 'Invisível', desc: 'Você aparece offline e continua recebendo mensagens.' }
    ];
    const flags = (k) => ({ isOnline: k === 'online', isBusy: k === 'busy', isInvis: k === 'invisible' });
    const statuses = OPTS.map((o) => {
      const on = pres === o.k;
      return Object.assign({
        label: o.label, desc: o.desc, on: on,
        checked: on ? 'true' : 'false',
        pick: () => { if (p.setPresence) p.setPresence(o.k); this.setState({ statusOpen: false }); },
        style: 'width: 100%; padding: 10px; border: none; border-radius: 11px; display: flex; align-items: flex-start; gap: 12px; text-align: left; cursor: pointer; color: #ECEDEE; background: ' + (on ? 'rgba(255,255,255,0.07)' : 'transparent') + ';'
      }, flags(o.k));
    });
    const cur = statuses.filter((x) => x.on)[0] || statuses[0];
    const nc = p.notifCount || 0;
    const un = p.unread || 0;
    const items = [
      { label: 'Meu perfil', icon: 'M20 21v-1a5 5 0 0 0-5-5H9a5 5 0 0 0-5 5v1M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z', badge: 0, onClick: this.call(p.goPerfil) },
      { label: 'Meu quarto', icon: 'M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', badge: 0, onClick: this.call(p.goRoom) },
      { label: 'Notificações', icon: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0', badge: nc, onClick: this.call(p.goNotifs) },
      { label: 'Mensagens', icon: 'M22 2 11 13M22 2 15 22l-4-9-9-4 20-7Z', badge: un, onClick: this.call(p.goInbox) },
      { label: 'Avaliações', icon: 'm12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2Z', badge: 0, onClick: this.call(p.goReviews) },
      { label: 'Fóruns', icon: 'M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2zM18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1', badge: 0, onClick: this.call(p.goForums) },
      { label: 'Editar avatar', icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01', badge: 0, onClick: this.call(p.goAvatar) },
      { label: 'Configurações', icon: 'M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z', badge: 0, onClick: this.call(p.goSettings) }
    ].map((it) => Object.assign(it, { hasBadge: it.badge > 0 }));
    return {
      accent: accent,
      avatarUri: p.avatarUri || '',
      hasCustomAvatar: !!p.avatarUri,
      noCustomAvatar: !p.avatarUri,
      name: p.name || 'Carol Guimarães',
      handle: p.handle || '',
      statuses: statuses,
      cur: cur,
      statusOpen: this.state.statusOpen,
      statusExpanded: this.state.statusOpen ? 'true' : 'false',
      chevRot: this.state.statusOpen ? 180 : 0,
      toggleStatus: () => this.setState({ statusOpen: !this.state.statusOpen }),
      logout: this.call(p.logout),
      items: items,
      close: this.call(p.close),
      goPerfil: this.call(p.goPerfil),
      tStart: (e) => { this._x0 = e.touches && e.touches[0] ? e.touches[0].clientX : null; },
      tEnd: (e) => {
        const t = e.changedTouches && e.changedTouches[0];
        if (this._x0 !== null && t && t.clientX - this._x0 < -50 && p.close) p.close();
        this._x0 = null;
      }
    };
  }
}
</script>
</body>
</html>
