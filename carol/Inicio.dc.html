<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Início</title>
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
  <style>
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body { margin: 0; background: #000000; color: #ECEDEE; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #338EF7; text-decoration: none; }
    a:hover { color: #66AAF9; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 776px; overflow: hidden; background: #000000;">
<div style="width: 390px; height: 776px; overflow-y: auto; background: #000000; padding-bottom: 32px;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 0; width: 381px; height: 55px">
    
    <button type="button" aria-label="Abrir menu" onClick="{{goMenu}}" style="width: 34px; height: 34px; padding: 0; border: none; border-radius: 9px; cursor: pointer; display: block; background: transparent; box-shadow: 0 0 0 2px {{accent}};">
      <sc-if value="{{hasCustomAvatar}}" hint-placeholder-val="{{false}}">
        <img src="{{avatarUri}}" alt="" width="34" height="34" style="display: block; border-radius: 9px; image-rendering: pixelated;">
      </sc-if>
      <sc-if value="{{noCustomAvatar}}" hint-placeholder-val="{{true}}">
      <svg width="34" height="34" viewBox="0 0 24 24" shape-rendering="crispEdges" style="display: block; border-radius: 9px;">
        <rect x="0" y="0" width="24" height="24" fill="#1F2A24"></rect>
        <rect x="4" y="2" width="16" height="8" fill="#3E7D5A"></rect>
        <rect x="0" y="6" width="4" height="10" fill="#3E7D5A"></rect>
        <rect x="20" y="6" width="4" height="10" fill="#3E7D5A"></rect>
        <rect x="6" y="8" width="12" height="10" fill="#3E7D5A"></rect>
        <rect x="8" y="12" width="3" height="3" fill="#0B0F0D"></rect>
        <rect x="13" y="12" width="3" height="3" fill="#0B0F0D"></rect>
        <rect x="9" y="17" width="6" height="2" fill="#0B0F0D"></rect>
      </svg>
      </sc-if>
    </button>

    <div style="display: flex; align-items: center; gap: 10px;">
    <button type="button" aria-label="{{notifAria}}" onClick="{{goNotifs}}" style="position: relative; width: 38px; height: 38px; padding: 0; border: none; border-radius: 12px; background: #212124; color: #ECEDEE; cursor: pointer; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <sc-if value="{{hasNotifs}}" hint-placeholder-val="{{false}}">
        <span style="position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #F31260; color: #FFFFFF; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #000000;">{{notifCount}}</span>
      </sc-if>
    </button>
    <button type="button" aria-label="Abrir mensagens" onClick="{{goInbox}}" style="position: relative; width: 38px; height: 38px; padding: 0; border: none; border-radius: 12px; background: #212124; color: #ECEDEE; cursor: pointer; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7Z"></path></svg>
      <sc-if value="{{hasUnread}}" hint-placeholder-val="{{false}}">
        <span style="position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #F31260; color: #FFFFFF; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #000000;">{{unreadCount}}</span>
      </sc-if>
    </button>
    </div>
  </div>

  <div style="padding: 14px 16px 0;">
    <div style="display: flex; gap: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <button type="button" onClick="{{pickPara}}" style="flex-grow: 1; padding: 0 0 10px; border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <span style="font-size: 14px; font-weight: {{tabs.para.weight}}; color: {{tabs.para.color}};">Para você</span>
        <div style="height: 2px; width: 100%; border-radius: 2px; background: {{tabs.para.bar}};"></div>
      </button>
      <button type="button" onClick="{{pickSeguindo}}" style="flex-grow: 1; padding: 0 0 10px; border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <span style="font-size: 14px; font-weight: {{tabs.seguindo.weight}}; color: {{tabs.seguindo.color}};">Seguindo</span>
        <div style="height: 2px; width: 100%; border-radius: 2px; background: {{tabs.seguindo.bar}};"></div>
      </button>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 16px 0;">
    <sc-for list="{{kindChips}}" as="c" hint-placeholder-count="3">
      <button type="button" onClick="{{c.pick}}" style="height: 30px; padding: 0 14px; border-radius: 999px; border: none; cursor: pointer; display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600; font-family: inherit; background: {{c.bg}}; color: {{c.color}}; box-shadow: inset 0px 0px 0px 1px {{c.ring}};">{{c.label}}
      </button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; padding: 4px 16px 0;">
    <sc-for list="{{feed}}" as="it" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">

        <sc-if value="{{it.isNews}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{it.openNews}}" aria-label="Ler matéria: {{it.headline}}" style="position: relative; display: block; padding: 0; border: none; text-align: left; cursor: pointer; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; background-color: {{it.bg}}; background-image: {{it.img}}; background-size: cover; background-position: center; width: 351px; height: 139px">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 65%; background-image: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.9) 100%);"></div>
            <span style="position: absolute; top: 10px; right: 10px; height: 22px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; background: rgba(0,0,0,0.62); color: {{it.kindColor}};">{{it.kindLabel}}</span>
            <div style="position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}};">{{it.tag}} · {{it.game}}</span>
              <span style="font-size: 15px; font-weight: 700; line-height: 1.3; color: #ECEDEE;">{{it.headline}}</span>
            </div>
          </button>
        </sc-if>

        <sc-if value="{{it.isReview}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{it.openAuthor}}" aria-label="Ver perfil de {{it.reviewer}}" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 0; border: none; background: transparent; cursor: pointer; text-align: left; color: inherit; font-family: inherit;">
            <svg width="30" height="30" viewBox="0 0 24 24" shape-rendering="crispEdges" style="flex-shrink: 0; border-radius: 6px;">
              <rect x="0" y="0" width="24" height="24" fill="{{it.avBg}}"></rect>
              <rect x="4" y="2" width="16" height="8" fill="{{it.avBody}}"></rect>
              <rect x="0" y="6" width="4" height="10" fill="{{it.avBody}}"></rect>
              <rect x="20" y="6" width="4" height="10" fill="{{it.avBody}}"></rect>
              <rect x="6" y="8" width="12" height="10" fill="{{it.avBody}}"></rect>
              <rect x="8" y="12" width="3" height="3" fill="{{it.avAccent}}"></rect>
              <rect x="13" y="12" width="3" height="3" fill="{{it.avAccent}}"></rect>
              <rect x="9" y="17" width="6" height="2" fill="{{it.avAccent}}"></rect>
            <image href="{{it.avUri}}" x="0" y="0" width="24" height="24"></image></svg>
            <div style="display: flex; flex-direction: column; min-width: 0;">
              <div style="font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;">{{it.reviewer}}</div>
              <div style="font-size: 11px; color: #71717A;">publicou uma avaliação</div>
            </div>
            <span style="margin-left: auto; flex-shrink: 0; height: 20px; padding: 0 9px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; background: {{it.kindBg}}; color: {{it.kindColor}};">{{it.kindLabel}}</span>
          </button>
          <div style="display: flex; gap: 12px;">
            <button type="button" onClick="{{it.openGame}}" aria-label="Abrir página de {{it.game}}" style="width: 56px; height: 76px; padding: 0; border: none; cursor: pointer; flex-shrink: 0; border-radius: 8px; background-color: {{it.bg}}; background-image: {{it.img}}; background-size: cover; background-position: center; box-shadow: inset 0px 0px 0px 1px rgba(255,255,255,0.08);"></button>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 8px; min-width: 0; align-self: flex-start; max-width: 100%;">
                <button type="button" onClick="{{it.openGame}}" style="min-width: 0; max-width: 100%; padding: 0; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 5px; color: #ECEDEE; font-size: 14px; font-weight: 700; text-align: left;">
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{it.game}}</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 18l6-6-6-6"></path></svg>
              </button>
              </div>
              <div style="display: flex; gap: 2px;">
                <sc-for list="{{it.stars}}" as="s" hint-placeholder-count="5">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="{{s.fill}}"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2Z"></path></svg>
                </sc-for>
              </div>
              <div style="font-size: 13px; line-height: 1.4; color: #D4D4D8; text-wrap: pretty;">{{it.text}}</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 16px; padding-top: 2px;">
            <button type="button" onClick="{{it.toggleLike}}" style="display: flex; align-items: center; gap: 5px; border: none; background: transparent; cursor: pointer; padding: 0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="{{it.likeFill}}" stroke="{{it.likeStroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"></path></svg>
              <span style="font-size: 12px; font-weight: 600; color: #A1A1AA;">{{it.likeCount}}</span>
            </button>
            <div style="display: flex; align-items: center; gap: 5px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
              <span style="font-size: 12px; font-weight: 600; color: #A1A1AA;">{{it.comments}} respostas</span>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{it.isDiscussion}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{it.openAuthor}}" aria-label="Ver perfil de {{it.reviewer}}" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 0; border: none; background: transparent; cursor: pointer; text-align: left; color: inherit; font-family: inherit;">
            <svg width="30" height="30" viewBox="0 0 24 24" shape-rendering="crispEdges" style="flex-shrink: 0; border-radius: 6px;">
              <rect x="0" y="0" width="24" height="24" fill="{{it.avBg}}"></rect>
              <rect x="4" y="2" width="16" height="8" fill="{{it.avBody}}"></rect>
              <rect x="0" y="6" width="4" height="10" fill="{{it.avBody}}"></rect>
              <rect x="20" y="6" width="4" height="10" fill="{{it.avBody}}"></rect>
              <rect x="6" y="8" width="12" height="10" fill="{{it.avBody}}"></rect>
              <rect x="8" y="12" width="3" height="3" fill="{{it.avAccent}}"></rect>
              <rect x="13" y="12" width="3" height="3" fill="{{it.avAccent}}"></rect>
              <rect x="9" y="17" width="6" height="2" fill="{{it.avAccent}}"></rect>
            <image href="{{it.avUri}}" x="0" y="0" width="24" height="24"></image></svg>
            <div style="display: flex; flex-direction: column; min-width: 0;">
              <div style="font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;">{{it.reviewer}}</div>
              <div style="font-size: 11px; color: #71717A;">iniciou uma discussão</div>
            </div>
            <span style="margin-left: auto; flex-shrink: 0; height: 20px; padding: 0 9px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; background: {{it.kindBg}}; color: {{it.kindColor}};">{{it.kindLabel}}</span>
          </button>
          <div style="display: flex; gap: 12px;">
            <button type="button" onClick="{{it.openGame}}" aria-label="Abrir página de {{it.game}}" style="width: 56px; height: 56px; padding: 0; border: none; cursor: pointer; flex-shrink: 0; border-radius: 8px; background-color: {{it.bg}}; background-image: {{it.img}}; background-size: cover; background-position: center; box-shadow: inset 0px 0px 0px 1px rgba(255,255,255,0.08);"></button>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; justify-content: center;">
              <div style="display: flex; align-items: center; gap: 8px; min-width: 0; align-self: flex-start; max-width: 100%;">
                <button type="button" onClick="{{it.openGame}}" style="min-width: 0; max-width: 100%; padding: 0; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 5px; color: #ECEDEE; font-size: 14px; font-weight: 700; text-align: left;">
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">em {{it.game}}</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 18l6-6-6-6"></path></svg>
              </button>
              </div>
              <button type="button" onClick="{{it.openTopic}}" aria-label="Abrir discussão" style="padding: 0; border: none; background: transparent; cursor: pointer; text-align: left; color: #D4D4D8; font-family: inherit; font-size: 13px; line-height: 1.4; text-wrap: pretty;">{{it.text}}</button>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 16px; padding-top: 2px;">
            <button type="button" onClick="{{it.toggleLike}}" style="display: flex; align-items: center; gap: 5px; border: none; background: transparent; cursor: pointer; padding: 0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="{{it.likeFill}}" stroke="{{it.likeStroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"></path></svg>
              <span style="font-size: 12px; font-weight: 600; color: #A1A1AA;">{{it.likeCount}}</span>
            </button>
            <button type="button" onClick="{{it.openTopic}}" style="display: flex; align-items: center; gap: 5px; border: none; background: transparent; cursor: pointer; padding: 0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
              <span style="font-size: 12px; font-weight: 600; color: #8FC7FF;">{{it.comments}} respostas · Ver discussão</span>
            </button>
          </div>
        </sc-if>

      </div>
    </sc-for>
  </div>

</div>
  <sc-if value="{{articleOpen}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-label="Matéria" style="position: absolute; inset: 0; z-index: 20; background: #09090B; display: flex; flex-direction: column;">
      <div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 12px 10px; background: #18181B; border-bottom: 1px solid rgba(255,255,255,0.08);">
        <button type="button" onClick="{{closeArticle}}" aria-label="Fechar matéria" style="width: 44px; height: 44px; padding: 0; border: none; border-radius: 12px; background: transparent; color: #ECEDEE; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
        <div style="flex: 1; min-width: 0; height: 36px; border-radius: 999px; background: #0E0E10; display: flex; align-items: center; justify-content: center; gap: 7px; color: #A1A1AA; font-size: 12.5px; font-weight: 600;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{article.url}}</span>
        </div>
        <span style="flex: none; width: 44px;"></span>
      </div>
      <div style="flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 40px;">
        <div style="position: relative; width: 100%; aspect-ratio: 16 / 9; background-color: {{article.bg}}; background-image: {{article.img}}; background-size: cover; background-position: center;">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background-image: linear-gradient(180deg, rgba(9,9,11,0) 0%, #09090B 100%);"></div>
        </div>
        <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 14px;">
          <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}};">{{article.tag}} · {{article.game}}</span>
          <h1 style="margin: 0; font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-size: 25px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em;">{{article.headline}}</h1>
          <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B4B4BE;">{{article.lead}}</p>
          <div style="display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #A1A1AA;">
            <span style="width: 30px; height: 30px; border-radius: 50%; background: #212124; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: #ECEDEE;">C</span>
            <span style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 13px; font-weight: 700; color: #ECEDEE;">Redação Círculo</span><span>{{article.meta}}</span></span>
          </div>
          <sc-for list="{{article.blocks}}" as="b" hint-placeholder-count="4">
            <sc-if value="{{b.isP}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 15.5px; line-height: 1.65; color: #D4D4D8; text-wrap: pretty;">{{b.text}}</p></sc-if>
            <sc-if value="{{b.isH}}" hint-placeholder-val="{{false}}"><h2 style="margin: 6px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.3;">{{b.text}}</h2></sc-if>
            <sc-if value="{{b.isStats}}" hint-placeholder-val="{{false}}">
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
                <sc-for list="{{b.items}}" as="s" hint-placeholder-count="3">
                  <div style="padding: 12px 10px; border-radius: 14px; background: #18181B; display: flex; flex-direction: column; gap: 4px;">
                    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: {{accent}};">{{s.value}}</span>
                    <span style="font-size: 11px; line-height: 1.3; color: #A1A1AA;">{{s.label}}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>
          </sc-for>
          <button type="button" onClick="{{articleOpenGame}}" style="margin-top: 8px; width: 100%; height: 48px; border: none; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer;">Ver página de {{article.game}}</button>
          <p style="margin: 6px 0 0; font-size: 11.5px; line-height: 1.5; color: #71717A;">Matéria ilustrativa criada para o protótipo do Círculo.</p>
        </div>
      </div>
    </div>
