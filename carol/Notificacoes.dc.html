<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Notificações</title>
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
  <style>
    * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body { margin: 0; background: #000000; color: #ECEDEE; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }
    .nt-title { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
    a { color: #338EF7; } a:hover { color: #66AAF9; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 776px; overflow: hidden; background: #000000; display: flex; flex-direction: column;">

  <div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px;">
    <button type="button" onClick="{{goBack}}" aria-label="Voltar" style="width: 38px; height: 38px; padding: 0; border: none; border-radius: 12px; background: #212124; color: #ECEDEE; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div class="nt-title" style="flex: 1; min-width: 0; font-size: 18px; font-weight: 700;">Notificações</div>
    <sc-if value="{{hasUnread}}" hint-placeholder-val="{{true}}">
      <button type="button" onClick="{{markAll}}" style="height: 38px; padding: 0 12px; border: none; border-radius: 12px; background: transparent; color: #338EF7; font-size: 13px; font-weight: 700; cursor: pointer; flex: none;">Marcar como lidas</button>
    </sc-if>
  </div>

  <div style="flex: none; display: flex; gap: 8px; padding: 2px 16px 10px; overflow-x: auto;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
      <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 28px;">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
      <div style="padding: 14px 16px 6px; font-size: 12.5px; font-weight: 800; color: #A1A1AA;">{{sec.label}}</div>
      <sc-for list="{{sec.items}}" as="n" hint-placeholder-count="3">
        <div style="{{n.rowStyle}}">
          <button type="button" onClick="{{n.open}}" aria-label="{{n.aria}}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: transparent; cursor: pointer; padding: 0;"></button>
          <div style="position: relative; width: 46px; height: 46px; flex: none; pointer-events: none;">
            <div style="width: 46px; height: 46px; border-radius: 13px; overflow: hidden; background: {{n.avBg}};">
              <sc-if value="{{n.hasAvatar}}" hint-placeholder-val="{{true}}">
                <img src="{{n.avatar}}" alt="" width="46" height="46" style="display: block; width: 46px; height: 46px; image-rendering: pixelated;">
              </sc-if>
            </div>
            <span style="{{n.badgeStyle}}">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
            </span>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; pointer-events: none;">
            <div style="font-size: 13.5px; line-height: 1.4; color: #D4D4D8;"><strong style="color: #ECEDEE; font-weight: 800;">{{n.who}}</strong> {{n.text}}</div>
            <sc-if value="{{n.hasQuote}}" hint-placeholder-val="{{false}}">
              <div style="font-size: 12.5px; line-height: 1.4; color: #A1A1AA; padding: 6px 10px; border-radius: 10px; background: #18181B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{n.quote}}</div>
            </sc-if>
            <div style="font-size: 11.5px; color: #71717A;">{{n.when}}</div>
            <sc-if value="{{n.hasActions}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; gap: 8px; padding-top: 4px; pointer-events: auto; position: relative; z-index: 2;">
                <button type="button" onClick="{{n.decline}}" style="height: 36px; padding: 0 16px; border-radius: 10px; border: 1px solid #3A3A40; background: transparent; color: #ECEDEE; font-size: 13px; font-weight: 700; cursor: pointer;">{{n.noLabel}}</button>
                <button type="button" onClick="{{n.accept}}" style="height: 36px; padding: 0 16px; border-radius: 10px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer;">{{n.yesLabel}}</button>
              </div>
            </sc-if>
            <sc-if value="{{n.hasResult}}" hint-placeholder-val="{{false}}">
              <div style="font-size: 12px; font-weight: 700; color: #A1A1AA;">{{n.result}}</div>
            </sc-if>
          </div>
          <sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}">
            <span aria-label="Não lida" style="width: 9px; height: 9px; flex: none; border-radius: 50%; background: {{accent}}; margin-top: 6px; pointer-events: none;"></span>
          </sc-if>
        </div>
      </sc-for>
    </sc-for>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div style="padding: 70px 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div class="nt-title" style="font-size: 16px; font-weight: 700;">Nada por aqui</div>
        <div style="font-size: 13px; line-height: 1.5; color: #A1A1AA;">Quando alguém te convidar, avaliar ou responder, aparece nesta lista.</div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#006FEE","options":["#006FEE","#9353D3","#17C964","#F5A524"],"section":"Tema"},"notifs":{"editor":null},"avatars":{"editor":null},"back":{"editor":null},"onOpen":{"editor":null},"onAnswer":{"editor":null},"onMarkAll":{"editor":null},"$preview":{"width":390,"height":776}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'todas', local: null };
  }
  sample() {
    return [
      { id: 'n1', kind: 'quarto', handle: '@rafabtt', who: 'Rafa Bittencourt', text: 'te convidou pro quarto dele.', when: 'Agora', group: 'hoje', read: false },
      { id: 'n2', kind: 'match', handle: '@yaz.codes', who: 'Yasmin Prado', text: 'deu match com você em Elden Ring. Mande um oi!', when: '12 min', group: 'hoje', read: false },
      { id: 'n3', kind: 'squad', handle: '@lari.dados', who: 'Noite de Catan', text: 'tem vaga pra você: o squad fechou 3 de 4.', when: '40 min', group: 'hoje', read: false },
      { id: 'n4', kind: 'avaliacao', handle: '@lari.dados', who: 'Larissa K.', text: 'avaliou seu perfil depois da partida.', quote: '“Carrega o time e é super paciente.”', when: '2 h', group: 'hoje', read: false },
      { id: 'n5', kind: 'curtida', handle: '@theov', who: 'Théo Vasques e mais 4', text: 'curtiram sua avaliação de Catan.', when: 'Ontem', group: 'antes', read: true },
      { id: 'n6', kind: 'forum', handle: '@cadu.plays', who: 'Camila Duarte', text: 'respondeu seu tópico em Fóruns.', quote: '“Pandemic é perfeito pra dupla, recomendo muito.”', when: 'Ontem', group: 'antes', read: true },
      { id: 'n7', kind: 'pedido', handle: '@sofi.alm', who: 'Sofia Almeida', text: 'pediu pra entrar no seu quarto.', when: '2 dias', group: 'antes', read: true },
      { id: 'n8', kind: 'seguir', handle: '@pedrosalg', who: 'Pedro Salgado', text: 'começou a seguir você.', when: '3 dias', group: 'antes', read: true }
    ];
  }
  kinds() {
    return {
      quarto: { color: '#006FEE', icon: 'M3 10.5L12 3l9 7.5M5 9.5V21h14V9.5M10 21v-6h4v6', cat: 'convites', aria: 'Convite para quarto' },
      pedido: { color: '#006FEE', icon: 'M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3', cat: 'convites', aria: 'Pedido para entrar' },
      match: { color: '#E8364F', icon: 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z', cat: 'matches', aria: 'Match' },
      squad: { color: '#9353D3', icon: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8', cat: 'matches', aria: 'Squad' },
      avaliacao: { color: '#F5A524', icon: 'M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z', cat: 'atividade', aria: 'Avaliação' },
      curtida: { color: '#E86FA0', icon: 'M7 10v12M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.5l-2.3 8A2 2 0 0 1 17.5 22H7V10l4-8a3 3 0 0 1 4 3.9z', cat: 'atividade', aria: 'Curtida' },
      forum: { color: '#17C964', icon: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z', cat: 'atividade', aria: 'Fórum' },
      seguir: { color: '#338EF7', icon: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6', cat: 'atividade', aria: 'Novo seguidor' }
    };
  }
  list() { return this.props.notifs || this.state.local || this.sample(); }
  setLocal(fn) { if (!this.props.notifs) this.setState({ local: fn(this.list()) }); }
  open(n) {
    if (this.props.onOpen) this.props.onOpen(n.id);
    else this.setLocal((l) => l.map((x) => (x.id === n.id ? Object.assign({}, x, { read: true }) : x)));
  }
  answer(n, yes) {
    if (this.props.onAnswer) this.props.onAnswer(n.id, yes);
    else this.setLocal((l) => l.map((x) => (x.id === n.id ? Object.assign({}, x, { read: true, answered: yes ? 'sim' : 'nao' }) : x)));
  }
  renderVals() {
    const accent = this.props.accent ?? '#006FEE', self = this, K = this.kinds(), av = this.props.avatars || {};
    const all = this.list();
    const f = this.state.filter;
    const chipDefs = [{ id: 'todas', label: 'Todas' }, { id: 'convites', label: 'Convites' }, { id: 'matches', label: 'Matches' }, { id: 'atividade', label: 'Atividade' }];
    const chips = chipDefs.map((c) => {
      const on = f === c.id;
      return { label: c.label, on: on, pick: () => self.setState({ filter: c.id }),
        style: 'flex: none; height: 34px; padding: 0 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: ' + (on ? '700' : '600') + '; background: ' + (on ? accent : '#18181B') + '; color: ' + (on ? '#FFFFFF' : '#D4D4D8') + '; border: 1px solid ' + (on ? accent : '#27272A') + ';' };
    });
    const vis = all.filter((n) => f === 'todas' || (K[n.kind] && K[n.kind].cat === f));
    const row = (n) => {
      const k = K[n.kind] || K.forum;
      const askable = (n.kind === 'quarto' || n.kind === 'pedido') && !n.answered;
      const result = n.answered ? (n.kind === 'quarto' ? (n.answered === 'sim' ? 'Você entrou no quarto' : 'Convite recusado') : (n.answered === 'sim' ? 'Pedido aceito' : 'Pedido recusado')) : '';
      const uri = av[n.handle] || '';
      return {
        who: n.who, text: n.text, when: n.when, quote: n.quote || '', hasQuote: !!n.quote,
        unread: !n.read, avatar: uri, hasAvatar: !!uri, avBg: uri ? '#18181B' : k.color,
        icon: k.icon, aria: k.aria + ': ' + n.who + ' ' + n.text,
        badgeStyle: 'position: absolute; right: -4px; bottom: -4px; width: 21px; height: 21px; border-radius: 50%; background: ' + k.color + '; border: 2.5px solid ' + (n.read ? '#000000' : '#0D1626') + '; display: flex; align-items: center; justify-content: center;',
        rowStyle: 'position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; background: ' + (n.read ? 'transparent' : '#0D1626') + ';',
        hasActions: askable, noLabel: 'Recusar', yesLabel: n.kind === 'quarto' ? 'Entrar' : 'Aceitar',
        hasResult: !!result, result: result,
        open: () => self.open(n),
        accept: (e) => { if (e && e.stopPropagation) e.stopPropagation(); self.answer(n, true); },
        decline: (e) => { if (e && e.stopPropagation) e.stopPropagation(); self.answer(n, false); }
      };
    };
    const sections = [];
    const hoje = vis.filter((n) => n.group === 'hoje'), antes = vis.filter((n) => n.group !== 'hoje');
    if (hoje.length) sections.push({ label: 'Hoje', items: hoje.map(row) });
    if (antes.length) sections.push({ label: 'Anteriores', items: antes.map(row) });
    return {
      accent: accent, chips: chips, sections: sections, isEmpty: vis.length === 0,
      hasUnread: all.some((n) => !n.read),
      markAll: () => { if (self.props.onMarkAll) self.props.onMarkAll(); else self.setLocal((l) => l.map((x) => Object.assign({}, x, { read: true }))); },
      goBack: () => { if (self.props.back) self.props.back(); }
    };
  }
}
</script>
</body>
</html>
