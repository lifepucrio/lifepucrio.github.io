  buildAvatarUris() {
    const cfgs = this.avatarConfigs();
    const out = {};
    Object.keys(cfgs).forEach((h) => { out[h] = this.uri(cfgs[h]); });
    return out;
  }

  mixLight(hex) {
    const n = parseInt(hex.slice(1), 16);
    const f = (c) => Math.round(c + (255 - c) * 0.6);
    const r = f((n >> 16) & 255), g = f((n >> 8) & 255), b = f(n & 255);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  buildReviewer(handle) {
    const d = this.directory().filter((x) => x.handle === handle)[0];
    if (!d) return null;
    const pal = this.palette()[d.pal];
    const mine = this.state.ratings[handle];
    const rep = Object.assign({}, d.rep);
    if (mine) {
      ['carry', 'chill', 'rage', 'again'].forEach((k) => { rep[k] = (d.rep[k] * d.rep.n + mine[k]) / (d.rep.n + 1); });
      rep.n = d.rep.n + 1;
    }
    const testimonials = d.testimonials.slice();
    if (mine && mine.comment) testimonials.unshift({ from: 'Você', handle: '@marina.rolls', pal: 0, text: mine.comment });
    return {
      id: handle, handle: handle, name: d.name, bg: pal.bg, body: pal.body, light: this.mixLight(pal.body),
      pix24: { bg: pal.bg, body: pal.body, accent: pal.accent },
      bio: d.bio, city: d.city, since: d.since, stats: d.stats, library: d.library, games: d.library.slice(0, 3), common: [],
      rep: rep, testimonials: testimonials, followsYou: d.followsYou,
      friend: !!this.state.follows[handle] && d.followsYou, matched: false, rated: !!mine
    };
  }

      return raw ? (JSON.parse(raw) || {}) : {};

        const s = this.state;
        window.localStorage.setItem('circulo-proto-perfil-v2', JSON.stringify({ account: s.account, settings: s.settings, location: s.location, showLocation: s.showLocation, avatarCfg: s.avatarCfg, profile: s.profile, profileCfg: s.profileCfg }));

    const person = typeof arg === 'string' ? null : arg;
    const h = person ? person.handle : arg;
    this.setState((prev) => {
      const unread = Object.assign({}, prev.unread);
      delete unread[h];
      return { chatHandle: h, unread: unread, people: person ? Object.assign({}, prev.people, { [h]: person }) : prev.people };
    });
  };

  }));

  rateFromChat = () => { if (this.state.chatHandle) this.openRate(this.state.chatHandle); };
  sendChat = (text) => {
    const h = this.state.chatHandle;
    if (!h) return;
    const n = (this.state.chats[h] || []).filter((m) => m.from === 'them').length;
    this.setState((prev) => ({
      chats: Object.assign({}, prev.chats, { [h]: (prev.chats[h] || []).concat([{ from: 'me', text: text, when: 'agora' }]) }),
      order: [h].concat(prev.order.filter((x) => x !== h))
    }));
    const bank = ['Oi! Que bom te ver por aqui.', 'Bora marcar? Qual horário fica bom pra você?', 'Combinado, me chama quando estiver livre.'];
    setTimeout(() => this.setState((prev) => {
      const open = prev.chatHandle === h;
      const unread = Object.assign({}, prev.unread);
      if (!open) unread[h] = (unread[h] || 0) + 1;
      return {
        chats: Object.assign({}, prev.chats, { [h]: (prev.chats[h] || []).concat([{ from: 'them', text: bank[Math.min(n, bank.length - 1)], when: 'agora' }]) }),
        order: [h].concat(prev.order.filter((x) => x !== h)),
        unread: unread
      };
    }), 1300);
  };
  joinSquad = (info) => this.setState((prev) => {
    if (prev.mySquads.some((q) => q.id === info.id)) return {};
    let msgs;
    if (info.mine) {
      msgs = [{ from: 'system', text: 'Você criou o squad. Combine tudo com o grupo por aqui.', when: 'agora' }];
    } else {
      msgs = [{ from: 'system', text: 'Você entrou no squad.', when: 'agora' }, { from: info.host, text: 'Bem-vindo(a) ao ' + info.name + '! Vamos combinar o horário por aqui.', when: 'agora' }];
      const other = info.members.filter((m) => m.handle !== info.host && m.handle !== '@marina.rolls')[0];
      if (other) msgs.push({ from: other.handle, text: 'Boa! A gente já estava esperando mais gente.', when: 'agora' });
    }
    return {
      mySquads: [info].concat(prev.mySquads),
      squadChats: Object.assign({}, prev.squadChats, { [info.id]: msgs }),
      squadUnread: info.mine ? prev.squadUnread : Object.assign({}, prev.squadUnread, { [info.id]: msgs.length - 1 })
    };
  });
  leaveSquad = (id) => this.setState((prev) => {
    const chats = Object.assign({}, prev.squadChats);
    const unread = Object.assign({}, prev.squadUnread);
    delete chats[id];
    delete unread[id];
    return { mySquads: prev.mySquads.filter((q) => q.id !== id), squadChats: chats, squadUnread: unread, squadChatId: prev.squadChatId === id ? null : prev.squadChatId };
  });
  openSquadChat = (id) => this.setState((prev) => {
    const unread = Object.assign({}, prev.squadUnread);
    delete unread[id];
    return { squadChatId: id, squadUnread: unread };
  });
  closeSquadChat = () => this.setState({ squadChatId: null });
  sendSquadChat = (text) => {
    const id = this.state.squadChatId;
    const info = this.state.mySquads.filter((q) => q.id === id)[0];
    if (!id || !info) return;
    const n = (this.state.squadChats[id] || []).filter((m) => m.from !== 'me' && m.from !== 'system').length;
    this.setState((prev) => ({ squadChats: Object.assign({}, prev.squadChats, { [id]: (prev.squadChats[id] || []).concat([{ from: 'me', text: text, when: 'agora' }]) }) }));
    const others = info.members.filter((m) => m.handle !== '@marina.rolls');
    if (others.length === 0) return;
    const bank = ['Show! Bora combinar o horário.', 'Fechado. Eu chamo o pessoal no Discord.', 'Alguém precisa de ajuda com as regras?', 'Tô dentro!'];
    const sender = others[n % others.length];
    setTimeout(() => this.setState((prev) => {
      if (!prev.mySquads.some((q) => q.id === id)) return {};
      const open = prev.squadChatId === id;
      const unread = Object.assign({}, prev.squadUnread);
      if (!open) unread[id] = (unread[id] || 0) + 1;
      return {
        squadChats: Object.assign({}, prev.squadChats, { [id]: (prev.squadChats[id] || []).concat([{ from: sender.handle, text: bank[n % bank.length], when: 'agora' }]) }),
        squadUnread: unread
      };
    }), 1400);
  };
  swStart = (e) => {
    const t = e.touches && e.touches[0];
    if (!t) return;
    const el = e.currentTarget;
    const key = el.getAttribute('data-back');
    if (key === 'topic' && !(this.state.forumsView && this.state.forumsView.topic)) { this._sw = null; return; }
    const rect = el.getBoundingClientRect();
    const scale = el.offsetWidth ? rect.width / el.offsetWidth : 1;
    if ((t.clientX - rect.left) / (scale || 1) > 44) { this._sw = null; return; }
    this._sw = { el: el, key: key, x0: t.clientX, y0: t.clientY, scale: scale || 1, active: false, dx: 0 };
  };
  swMove = (e) => {
    const s = this._sw;
    if (!s) return;
    const t = e.touches[0];
    const dx = (t.clientX - s.x0) / s.scale;
    const dy = (t.clientY - s.y0) / s.scale;
    if (!s.active) {
      if (Math.abs(dy) > 16 && Math.abs(dy) > Math.abs(dx)) { this._sw = null; return; }
      if (dx > 12 && dx > Math.abs(dy) * 1.3) s.active = true; else return;
    }
    s.dx = Math.max(0, dx);
    s.el.style.transition = 'none';
    s.el.style.transform = 'translateX(' + s.dx + 'px)';
  };
  swEnd = () => {
    const s = this._sw;
    this._sw = null;
    if (!s || !s.active) return;
    const el = s.el;
    const clear = () => { try { el.style.transition = ''; el.style.transform = ''; } catch (err) { /* elemento removido */ } };
    if (s.dx > 90) {
      el.style.transition = 'transform .18s ease-out';
      el.style.transform = 'translateX(400px)';
      setTimeout(() => { this.swipeBack(s.key); setTimeout(clear, 80); }, 170);
    } else {
      el.style.transition = 'transform .2s ease';
      el.style.transform = 'translateX(0)';
      setTimeout(clear, 220);
    }
  };
  swipeBack = (key) => {
    const map = { inbox: this.closeInbox, settings: this.closeSettings, avatar: this.closeAvatar, game: this.closeGame, view: this.closeView, squadchat: this.closeSquadChat, chat: this.closeChat, rate: this.closeRate };
    if (key === 'topic') { if (this.state.forumsView && this.state.forumsView.topic) this.exitTopic(); return; }
    if (map[key]) map[key]();
  };
  savePrefs = (prefs) => this.setState({ prefs: prefs });
  notify = (text) => {
    this.setState({ toast: text });
    setTimeout(() => this.setState({ toast: '' }), 3400);
  };
  setPrefsOpen = (open) => this.setState({ prefsOpen: open });
  publishReview = (review) => this.setState((prev) => ({ myReviews: [review].concat(prev.myReviews) }));
  deleteReview = (id) => this.setState((prev) => ({ myReviews: prev.myReviews.filter((r) => r.id !== id) }));
  openPerson = (handle) => {
    if (handle === '@marina.rolls') this.go('perfil');
    else if (this.directory().some((d) => d.handle === handle) || this.state.people[handle]) this.setState((prev) => ({ viewHandle: handle, gameView: prev.gameView ? Object.assign({}, prev.gameView, { top: false }) : null }));
  };
  closeView = () => this.setState({ viewHandle: null });
  toggleFollow = (handle) => this.setState((prev) => ({ follows: Object.assign({}, prev.follows, { [handle]: !prev.follows[handle] }) }));
  openRate = (arg) => {
    const target = typeof arg === 'string' ? this.resolvePerson(arg) : arg;
    if (target) this.setState({ rateTarget: target });
  };
  closeRate = () => this.setState({ rateTarget: null });
  submitRating = (draft) => {
    const t = this.state.rateTarget;
    if (!t) return;
    this.setState((prev) => ({ ratings: Object.assign({}, prev.ratings, { [t.id]: draft }), rateTarget: null, toast: 'Avaliação enviada para ' + t.name + '.' }));
    setTimeout(() => this.setState({ toast: '' }), 2200);
  };

  renderVals() {
    const screen = this.state.screen;
    const vw = this.state.vw;
    const vh = this.state.vh;
    // Escala para preencher a tela do aparelho (aumenta ou reduz), mantendo a proporção 390×844
    const fit = (vw >= 200 && vh >= 200) ? Math.min(vw / 390, vh / 844) : 1;
    const padTop = (vh >= 200) ? Math.max(0, Math.floor((vh - 844 * fit) / 2)) : 0;
    const fitFont = "font-family:'Manrope','Segoe UI',system-ui,sans-serif;color:#ECEDEE;";
    const layer = (id) => 'position:absolute;left:0;top:0;width:390px;height:776px;overflow:hidden;display:' + (screen === id ? 'block' : 'none') + ';';
    const defs = [
      { id: 'inicio', label: 'Início', icon: 'M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
      { id: 'foruns', label: 'Fóruns', icon: 'M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2zM18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1' },
      { id: 'match', label: 'Jogar', icon: "M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0 M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2 M16 3.13a4 4 0 0 1 0 7.75 M21 21v-2a4 4 0 0 0 -3 -3.85" },
      { id: 'avaliacoes', label: 'Avaliações', icon: 'm12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2Z' },
      { id: 'perfil', label: 'Perfil', icon: 'M20 21v-1a5 5 0 0 0-5-5H9a5 5 0 0 0-5 5v1M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z' }
    ];
    const tabs = defs.map((d) => {
      const on = screen === d.id;
      return {
        label: d.label,
        icon: d.icon,
        color: on ? '#338EF7' : '#A1A1AA',
        weight: on ? 700 : 500,
        current: on ? 'page' : 'false',
        onClick: () => this.go(d.id)
      };
    });
    const friends = this.directory().filter((d) => this.state.follows[d.handle] && d.followsYou).map((d) => d.handle);
    const viewPerson = this.state.viewHandle ? this.resolvePerson(this.state.viewHandle) : null;
    const rt = this.state.rateTarget;
    const chatPerson = this.state.chatHandle ? this.resolvePerson(this.state.chatHandle) : null;
    const avatars = Object.assign({}, this.staticAvatars, { '@marina.rolls': this.state.avatarUri });
    const blank = { bg: '#000000', body: '#000000', accent: '#000000' };
    const conversations = [];
    this.state.order.forEach((h) => {
      const p = this.resolvePerson(h);
      if (!p) return;
      const msgs = this.state.chats[h] || [];
      if (msgs.length === 0 && !p.matched) return;
      const last = msgs[msgs.length - 1];
      const count = this.state.unread[h] || 0;
      conversations.push({
        key: h, name: p.name, kind: p.matched ? 'match' : 'friend', kindLabel: p.matched ? 'Duo' : 'Amigo',
        preview: last ? (last.from === 'me' ? 'Você: ' : '') + last.text : (p.matched ? 'Vocês formaram um Duo — comece a conversa!' : 'Vocês são amigos — comece a conversa!'),
        when: last ? (last.when || 'agora') : 'novo',
        hasUnread: count > 0, unreadCount: count,
        avUri: avatars[h] || '', is24: !!p.pix24, is8: !p.pix24, pix: p.pix24 || blank, av: { bg: p.bg || '#000000', body: p.body || '#000000', light: p.light || '#000000' },
        onOpen: () => this.openChat(h)
      });
    });
    const squadFirst = (q, h) => { const m = q.members.filter((x) => x.handle === h)[0]; return m ? m.name.split(' ')[0] : h; };
    const squadRows = this.state.mySquads.map((q) => {
      const msgs = this.state.squadChats[q.id] || [];
      const last = msgs[msgs.length - 1];
      const count = this.state.squadUnread[q.id] || 0;
      let preview = 'Sem mensagens ainda';
      if (last) preview = last.from === 'system' ? last.text : (last.from === 'me' ? 'Você: ' : squadFirst(q, last.from) + ': ') + last.text;
      return { key: q.id, name: q.name, game: q.game, coverStyle: q.coverStyle, initial: q.initial, memberCount: q.members.length, preview: preview, when: last ? (last.when || 'agora') : 'novo', hasUnread: count > 0, unreadCount: count, onOpen: () => this.openSquadChat(q.id) };
    });
    const openSquad = this.state.squadChatId ? this.state.mySquads.filter((q) => q.id === this.state.squadChatId)[0] : null;
    const squadChatView = openSquad ? { name: openSquad.name, game: openSquad.game, coverStyle: openSquad.coverStyle, initial: openSquad.initial, members: openSquad.members.map((m) => ({ handle: m.handle, name: m.name, uri: avatars[m.handle] || '' })) } : null;
    const squadChatMsgs = openSquad ? (this.state.squadChats[openSquad.id] || []).map((m) => ({ from: m.from, text: m.text, name: m.from === 'me' || m.from === 'system' ? '' : squadFirst(openSquad, m.from), uri: avatars[m.from] || '' })) : [];
    const unreadTotal = conversations.filter((c) => c.hasUnread).length + squadRows.filter((r) => r.hasUnread).length;
    const starters = this.directory().filter((d) => this.state.follows[d.handle] && d.followsYou && !conversations.some((c) => c.key === d.handle)).map((d) => {
      const pal = this.palette()[d.pal];
      return { name: d.name, firstName: d.name.split(' ')[0], avUri: avatars[d.handle] || '', pix: { bg: pal.bg, body: pal.body, accent: pal.accent }, onOpen: () => this.openChat(d.handle) };
    });
    const ratePerson = rt && rt.pix24 ? this.buildReviewer(rt.handle) : rt;
    return {
      fitOuter: 'position:relative;width:' + Math.floor(390 * fit) + 'px;height:' + Math.floor(844 * fit) + 'px;overflow:hidden;margin:' + padTop + 'px auto 0;background:#000000;',
      fitInner: 'position:relative;width:390px;height:844px;background:#000000;overflow:hidden;' + fitFont + 'transform:scale(' + fit + ');transform-origin:0 0;',
      go: this.go,
      savePrefs: this.savePrefs,
      notify: this.notify,
      prefs: this.state.prefs,
      prefsOpen: this.state.prefsOpen,
      setPrefsOpen: this.setPrefsOpen,
      myReviews: this.state.myReviews,
      publishReview: this.publishReview,
      deleteReview: this.deleteReview,
      ratings: this.state.ratings,
      follows: this.state.follows,
      toggleFollow: this.toggleFollow,
      openRate: this.openRate,
      openPerson: this.openPerson,
      friends: friends,
      showView: !!viewPerson,
      viewPerson: viewPerson,
      viewFollowing: viewPerson ? !!this.state.follows[viewPerson.handle] : false,
      viewToggleFollow: () => { if (viewPerson) this.toggleFollow(viewPerson.handle); },
      closeView: this.closeView,
      messageFromView: () => { if (viewPerson && (viewPerson.friend || viewPerson.matched)) this.openChat(viewPerson.handle); },
      avatars: avatars,
      profileName: this.state.profile.nome,
      profileBio: this.state.profile.bio,
      saveProfile: this.saveProfile,
      profileCfg: this.state.profileCfg,
      saveProfileCfg: this.saveProfileCfg,
      showSettings: this.state.settingsOpen,
      account: this.state.account,
      settings: this.state.settings,
      myHandle: '@' + this.state.account.username,
      location: this.state.location,
      showLocation: this.state.showLocation,
      openSettings: this.openSettings,
      closeSettings: this.closeSettings,
      updateAccount: this.updateAccount,
      setSetting: this.setSetting,
      saveLocation: this.saveLocation,
      logout: this.logout,
      showAvatarMaker: this.state.avatarOpen,
      avatarCfg: this.state.avatarCfg,
      avatarUri: this.state.avatarUri,
      openAvatar: this.openAvatar,
      closeAvatar: this.closeAvatar,
      saveAvatar: this.saveAvatar,
      showGame: !!this.state.gameView,
      gameView: this.state.gameView,
      gameLayerStyle: 'position:absolute;left:0;top:0;width:390px;height:776px;background:#000000;z-index:' + (this.state.gameView && this.state.gameView.top ? 22 : 17) + ';',
      myLists: this.state.myLists,
      toggleInList: this.toggleInList,
      createList: this.createList,
      deleteList: this.deleteList,
      openGame: this.openGame,
      closeGame: this.closeGame,
      exitTopic: this.exitTopic,
      showInbox: this.state.inboxOpen,
      inboxFilter: this.state.inboxFilter,
      conversations: conversations,
      starters: starters,
      unreadTotal: unreadTotal,
      squadRows: squadRows,
      showSquadChat: !!openSquad,
      squadChatView: squadChatView,
      squadChatMsgs: squadChatMsgs,
      swStart: this.swStart,
      swMove: this.swMove,
      swEnd: this.swEnd,
      joinSquad: this.joinSquad,
      leaveSquad: this.leaveSquad,
      openSquadChat: this.openSquadChat,
      closeSquadChat: this.closeSquadChat,
      sendSquadChat: this.sendSquadChat,
      openInbox: this.openInbox,
      closeInbox: this.closeInbox,
      openChat: this.openChat,
      onMatch: this.onMatch,
      rateFromChat: this.rateFromChat,
      showChat: !!chatPerson,
      chatPerson: chatPerson,
      chatMessages: this.state.chatHandle ? (this.state.chats[this.state.chatHandle] || []) : [],
      sendChat: this.sendChat,
      closeChat: this.closeChat,
      openProfileFromChat: this.openProfileFromChat,
      openTopic: this.openTopic,
      forumsView: this.state.forumsView,
      setForumsView: this.setForumsView,
      rateFromView: () => { if (viewPerson) this.openRate(viewPerson.handle); },
      showRate: !!rt,
      ratePerson: ratePerson,
      rateInitial: rt ? (this.state.ratings[rt.id] || null) : null,
      submitRating: this.submitRating,
      closeRate: this.closeRate,
      toastStyle: 'position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(' + (this.state.toast ? '0' : '-160%') + ');transition:transform .25s ease;background:#28282C;border:1px solid rgba(255,255,255,0.16);color:#ECEDEE;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:999px;z-index:100;white-space:nowrap;',
      toastText: this.state.toast,
      inicioStyle: layer('inicio'),
      forunsStyle: layer('foruns'),
      matchStyle: layer('match'),
      avaliacoesStyle: layer('avaliacoes'),
      perfilStyle: layer('perfil'),
      tabs: tabs
    };
  }
}
</script>
</body>
