<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Conversa</title>
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
  <style>
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body { margin: 0; background: #000000; color: #ECEDEE; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }
    .cv-input { flex: 1; min-width: 0; height: 44px; background: #212124; border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 0 16px; color: #ECEDEE; font-family: 'Manrope', sans-serif; font-size: 14px; outline: none; }
    .cv-input:focus { border-color: rgba(51,142,247,0.6); }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 776px; overflow: hidden; background: #000000; display: flex; flex-direction: column;">

  <div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);">
    <button type="button" onClick="{{goBack}}" aria-label="Voltar" style="width: 38px; height: 38px; padding: 0; border: none; border-radius: 12px; background: #212124; color: #ECEDEE; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <button type="button" onClick="{{openProfile}}" aria-label="Ver perfil de {{name}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0; border: none; background: transparent; color: inherit; font-family: inherit; text-align: left; cursor: pointer;">
      <sc-if value="{{is24}}" hint-placeholder-val="{{true}}">
        <svg width="38" height="38" viewBox="0 0 24 24" shape-rendering="crispEdges" style="flex-shrink: 0; border-radius: 10px;">
          <rect x="0" y="0" width="24" height="24" fill="{{pix.bg}}"></rect>
          <rect x="4" y="2" width="16" height="8" fill="{{pix.body}}"></rect>
          <rect x="0" y="6" width="4" height="10" fill="{{pix.body}}"></rect>
          <rect x="20" y="6" width="4" height="10" fill="{{pix.body}}"></rect>
          <rect x="6" y="8" width="12" height="10" fill="{{pix.body}}"></rect>
          <rect x="8" y="12" width="3" height="3" fill="{{pix.accent}}"></rect>
          <rect x="13" y="12" width="3" height="3" fill="{{pix.accent}}"></rect>
          <rect x="9" y="17" width="6" height="2" fill="{{pix.accent}}"></rect>
        <image href="{{avUri}}" x="0" y="0" width="24" height="24"></image></svg>
      </sc-if>
      <sc-if value="{{is8}}" hint-placeholder-val="{{false}}">
        <svg width="38" height="38" viewBox="0 0 8 8" shape-rendering="crispEdges" style="flex-shrink: 0; border-radius: 10px;">
          <rect width="8" height="8" fill="{{av.bg}}"></rect><rect x="1" y="1" width="6" height="6" fill="{{av.body}}"></rect><rect x="1" y="1" width="1" height="1" fill="{{av.bg}}"></rect><rect x="6" y="6" width="1" height="1" fill="{{av.bg}}"></rect><rect x="2.5" y="3.5" width="1" height="1" fill="{{av.light}}"></rect><rect x="4.5" y="3.5" width="1" height="1" fill="{{av.light}}"></rect><rect x="3" y="5.5" width="2" height="0.6" fill="{{av.bg}}"></rect><rect x="3.5" y="0" width="1" height="1" fill="{{av.light}}"></rect>
        <image href="{{avUri}}" x="0" y="0" width="8" height="8"></image></svg>
      </sc-if>
      <div style="display: flex; flex-direction: column; min-width: 0;">
        <div style="font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{name}}</div>
        <div style="font-size: 11.5px; color: {{kindColor}}; font-weight: 600;">{{kindLabel}}</div>
      </div>
    </button>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
    <sc-if value="{{showRateCard}}" hint-placeholder-val="{{true}}">
      <div style="flex: none; display: flex; align-items: center; gap: 12px; background: #18181B; border-radius: 14px; padding: 10px 12px; box-shadow: inset 0px 0px 1px 0px rgba(255,255,255,0.15); margin-bottom: 4px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: rgba(245,165,36,0.16); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#F5A524"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2Z"></path></svg>
        </span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 13px; font-weight: 700;">{{rateTitle}}</div>
          <div style="font-size: 11.5px; color: #A1A1AA;">{{rateText}}</div>
        </div>
        <button type="button" onClick="{{goRate}}" style="flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid {{rateBorder}}; background: {{rateBg}}; color: {{rateColor}}; font-size: 12px; font-weight: 700; cursor: pointer;">{{rateBtn}}</button>
      </div>
    </sc-if>

    <div style="flex: 1; min-height: 8px;"></div>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div style="align-self: center; text-align: center; max-width: 290px; padding: 8px 0 10px; font-size: 13px; line-height: 1.5; color: #A1A1AA;">{{emptyText}}</div>
      <sc-if value="{{hasIcebreaker}}" hint-placeholder-val="{{false}}">
        <div style="background: rgba(224,68,123,0.1); border: 1px solid rgba(224,68,123,0.3); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #F38CB0;">Sugestão de quebra-gelo</div>
          <div style="font-size: 13.5px; line-height: 1.5; color: #ECEDEE;">"{{icebreaker}}"</div>
          <button type="button" onClick="{{sendIcebreaker}}" style="height: 40px; border: none; border-radius: 12px; background: #E0447B; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer;">Enviar quebra-gelo</button>
        </div>
      </sc-if>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-bottom: 6px;">
        <sc-for list="{{starters}}" as="s" hint-placeholder-count="3">
          <button type="button" onClick="{{s.onPick}}" style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: #212124; color: #ECEDEE; font-size: 12.5px; font-weight: 600; cursor: pointer;">{{s.label}}</button>
        </sc-for>
      </div>
    </sc-if>
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="{{m.style}}">{{m.text}}</div>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px 18px; border-top: 1px solid rgba(255,255,255,0.08); background: #09090B;">
    <input class="cv-input" placeholder="Mensagem para {{firstName}}" value="{{draft}}" onInput="{{onDraft}}" onKeyDown="{{onKey}}">
    <button type="button" onClick="{{send}}" aria-label="Enviar" style="{{sendStyle}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7Z"></path></svg>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"person":{"editor":null},"messages":{"editor":null},"send":{"editor":null},"back":{"editor":null},"openProfile":{"editor":null},"rate":{"editor":null},"avatars":{"editor":null},"$preview":{"width":390,"height":776}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: '' };
  }

  submit = (text) => {
    const t = (text || '').trim();
    if (!t) return;
    if (this.props.send) this.props.send(t);
    this.setState({ draft: '' });
  };

  renderVals() {
    const p = this.props.person || { name: 'Amigo', pix24: { bg: '#1F2A24', body: '#3E7D5A', accent: '#0B0F0D' } };
    const messages = this.props.messages || [];
    const draft = this.state.draft;
    const first = (p.name || '').split(' ')[0];
    const is24 = !!p.pix24;
    const kind = p.matched && p.friend ? 'Duo · Amigos' : (p.matched ? 'Duo' : 'Amigos');
    const rated = !!p.rated;
    const bubble = (mine) => 'max-width: 78%; padding: 10px 14px; font-size: 13.5px; line-height: 1.45; text-wrap: pretty; border-radius: ' + (mine ? '18px 18px 6px 18px' : '18px 18px 18px 6px') + '; align-self: ' + (mine ? 'flex-end' : 'flex-start') + '; background: ' + (mine ? '#006FEE' : '#212124') + '; color: ' + (mine ? '#FFFFFF' : '#ECEDEE') + ';';
    return {
      name: p.name,
      avUri: (this.props.avatars || {})[p.handle] || '',
      firstName: first,
      is24: is24,
      is8: !is24,
      pix: p.pix24 || { bg: '#000000', body: '#000000', accent: '#000000' },
      av: { bg: p.bg || '#000000', body: p.body || '#000000', light: p.light || '#000000' },
      kindLabel: kind,
      kindColor: p.matched ? '#F38CB0' : '#8FC7FF',
      showRateCard: true,
      rateTitle: rated ? 'Você avaliou ' + first : 'Já jogaram juntos?',
      rateText: rated ? 'Sua avaliação já aparece no perfil de ' + first + '.' : 'Avalie ' + first + ' e ajude a comunidade.',
      rateBtn: rated ? 'Editar' : 'Avaliar',
      rateBg: rated ? 'transparent' : '#006FEE',
      rateBorder: rated ? 'rgba(255,255,255,0.16)' : '#006FEE',
      rateColor: rated ? '#ECEDEE' : '#FFFFFF',
      goRate: () => { if (this.props.rate) this.props.rate(); },
      isEmpty: messages.length === 0,
      emptyText: p.matched ? 'Vocês formaram um Duo. Comece a conversa com ' + first + '.' : 'Vocês se seguem mutuamente. Comece a conversa com ' + first + '.',
      hasIcebreaker: !!p.icebreaker,
      icebreaker: p.icebreaker || '',
      sendIcebreaker: () => this.submit(p.icebreaker),
      starters: ['Bora jogar hoje?', 'O que você tem jogado?', 'Oi!'].map((label) => ({ label: label, onPick: () => this.submit(label) })),
      msgs: messages.map((m) => ({ text: m.text, style: bubble(m.from === 'me') })),
      draft: draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') this.submit(this.state.draft); },
      send: () => this.submit(this.state.draft),
      sendStyle: 'width: 44px; height: 44px; padding: 0; border: none; border-radius: 50%; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #FFFFFF; background: ' + (draft.trim() ? '#006FEE' : '#27272A') + ';',
      goBack: () => { if (this.props.back) this.props.back(); },
      openProfile: () => { if (this.props.openProfile) this.props.openProfile(); }
    };
  }
}
</script>
</body>
</html>
