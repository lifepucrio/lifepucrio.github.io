<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Chat do squad</title>
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
  <style>
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body { margin: 0; background: #000000; color: #ECEDEE; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }
    .cs-input { flex: 1; min-width: 0; height: 44px; background: #212124; border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 0 16px; color: #ECEDEE; font-family: 'Manrope', sans-serif; font-size: 14px; outline: none; }
    .cs-input:focus { border-color: rgba(51,142,247,0.6); }
    .cs-clamp1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 776px; overflow: hidden; background: #000000; display: flex; flex-direction: column;">

  <div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);">
    <button type="button" onClick="{{goBack}}" aria-label="Voltar" style="width: 38px; height: 38px; padding: 0; border: none; border-radius: 12px; background: #212124; color: #ECEDEE; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #A1A1AA; {{coverStyle}}">{{initial}}</div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="cs-clamp1" style="font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700;">{{name}}</div>
      <div class="cs-clamp1" style="font-size: 11.5px; color: #A1A1AA; font-weight: 600;">{{subtitle}}</div>
    </div>
    <div style="display: flex; flex-shrink: 0;">
      <sc-for list="{{memberAvs}}" as="m" hint-placeholder-count="3">
        <img src="{{m.uri}}" alt="" style="width: 26px; height: 26px; border-radius: 8px; border: 2px solid #000000; margin-left: -8px; image-rendering: pixelated; background: #27272A;">
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="flex: 1; min-height: 8px;"></div>
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <sc-if value="{{m.isSystem}}" hint-placeholder-val="{{false}}">
        <div style="align-self: center; max-width: 280px; text-align: center; padding: 4px 12px; border-radius: 999px; background: #18181B; font-size: 11.5px; color: #A1A1AA;">{{m.text}}</div>
      </sc-if>
      <sc-if value="{{m.isMe}}" hint-placeholder-val="{{false}}">
        <div style="align-self: flex-end; max-width: 78%; padding: 10px 14px; font-size: 13.5px; line-height: 1.45; text-wrap: pretty; border-radius: 18px 18px 6px 18px; background: #006FEE; color: #FFFFFF;">{{m.text}}</div>
      </sc-if>
      <sc-if value="{{m.isOther}}" hint-placeholder-val="{{true}}">
        <div style="align-self: flex-start; max-width: 86%; display: flex; align-items: flex-end; gap: 8px;">
          <img src="{{m.uri}}" alt="" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 9px; image-rendering: pixelated; background: #27272A;">
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <span style="font-size: 11px; font-weight: 700; color: #A1A1AA; padding-left: 4px;">{{m.name}}</span>
            <div style="padding: 10px 14px; font-size: 13.5px; line-height: 1.45; text-wrap: pretty; border-radius: 18px 18px 18px 6px; background: #212124; color: #ECEDEE;">{{m.text}}</div>
          </div>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px 18px; border-top: 1px solid rgba(255,255,255,0.08); background: #09090B;">
    <input class="cs-input" placeholder="Mensagem para o grupo" value="{{draft}}" onInput="{{onDraft}}" onKeyDown="{{onKey}}">
    <button type="button" onClick="{{send}}" aria-label="Enviar" style="{{sendStyle}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7Z"></path></svg>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"squad":{"editor":null},"messages":{"editor":null},"send":{"editor":null},"back":{"editor":null},"$preview":{"width":390,"height":776}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: '' };
  }

  submit = (text) => {
    const t = (text || '').trim();
    if (!t) return;
    if (this.props.send) this.props.send(t);
    this.setState({ draft: '' });
  };

  renderVals() {
    const sq = this.props.squad || { name: 'Squad', game: '', members: [], coverStyle: '', initial: '' };
    const messages = this.props.messages || [];
    const draft = this.state.draft;
    const n = (sq.members || []).length;
    return {
      name: sq.name,
      coverStyle: sq.coverStyle || '',
      initial: sq.initial || '',
      subtitle: sq.game + ' · ' + n + (n === 1 ? ' membro' : ' membros'),
      memberAvs: (sq.members || []).slice(0, 3).map((m) => ({ uri: m.uri || '' })),
      msgs: messages.map((m) => ({
        text: m.text, name: m.name || '', uri: m.uri || '',
        isSystem: m.from === 'system', isMe: m.from === 'me', isOther: m.from !== 'system' && m.from !== 'me'
      })),
      draft: draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') this.submit(this.state.draft); },
      send: () => this.submit(this.state.draft),
      sendStyle: 'width: 44px; height: 44px; padding: 0; border: none; border-radius: 50%; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #FFFFFF; background: ' + (draft.trim() ? '#006FEE' : '#27272A') + ';',
      goBack: () => { if (this.props.back) this.props.back(); }
    };
  }
}
</script>
</body>
</html>
