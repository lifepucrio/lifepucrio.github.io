<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Mensagens</title>
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
  <style>
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body { margin: 0; background: #000000; color: #ECEDEE; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }
    .ms-title { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
    .ms-clamp1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 776px; overflow: hidden; background: #000000; display: flex; flex-direction: column;">

  <div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px;">
    <button type="button" onClick="{{goBack}}" aria-label="Voltar" style="width: 38px; height: 38px; padding: 0; border: none; border-radius: 12px; background: #212124; color: #ECEDEE; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="ms-title" style="font-size: 22px; font-weight: 700; line-height: 1.15;">Mensagens</div>
      <div style="font-size: 11.5px; color: #A1A1AA;">{{summary}}</div>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding-bottom: 24px;">

    <sc-if value="{{hasStarters}}" hint-placeholder-val="{{true}}">
      <div style="padding: 6px 0 0;">
        <div style="padding: 0 16px 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #71717A;">Iniciar conversa com amigos</div>
        <div style="display: flex; gap: 14px; overflow-x: auto; padding: 0 16px 4px;">
          <sc-for list="{{starters}}" as="f" hint-placeholder-count="5">
            <button type="button" onClick="{{f.onOpen}}" aria-label="Conversar com {{f.name}}" style="flex-shrink: 0; width: 56px; padding: 0; border: none; background: transparent; color: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <svg width="52" height="52" viewBox="0 0 24 24" shape-rendering="crispEdges" style="display: block; border-radius: 14px;">
                <rect x="0" y="0" width="24" height="24" fill="{{f.pix.bg}}"></rect>
                <rect x="4" y="2" width="16" height="8" fill="{{f.pix.body}}"></rect>
                <rect x="0" y="6" width="4" height="10" fill="{{f.pix.body}}"></rect>
                <rect x="20" y="6" width="4" height="10" fill="{{f.pix.body}}"></rect>
                <rect x="6" y="8" width="12" height="10" fill="{{f.pix.body}}"></rect>
                <rect x="8" y="12" width="3" height="3" fill="{{f.pix.accent}}"></rect>
                <rect x="13" y="12" width="3" height="3" fill="{{f.pix.accent}}"></rect>
                <rect x="9" y="17" width="6" height="2" fill="{{f.pix.accent}}"></rect>
              <image href="{{f.avUri}}" x="0" y="0" width="24" height="24"></image></svg>
              <span class="ms-clamp1" style="max-width: 56px; font-size: 11px; font-weight: 600; color: #D4D4D8;">{{f.firstName}}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; gap: 8px; padding: 16px 16px 4px;">
      <sc-for list="{{filterChips}}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{c.onClick}}" style="{{c.style}}">{{c.label}}<span style="margin-left: 6px; opacity: .7;">{{c.count}}</span></button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; padding: 0 16px;">
      <sc-if value="{{showSquads}}" hint-placeholder-val="{{false}}">
        <div style="padding: 10px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #71717A;">Squads</div>
        <sc-for list="{{squadRows}}" as="q" hint-placeholder-count="2">
          <button type="button" onClick="{{q.onOpen}}" style="width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid rgba(255,255,255,0.06); background: transparent; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px;">
            <div style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 13px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: #A1A1AA; {{q.coverStyle}}">{{q.initial}}</div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span class="ms-clamp1" style="font-size: 14.5px; font-weight: {{q.nameWeight}}; min-width: 0;">{{q.name}}</span>
                <span style="flex-shrink: 0; height: 17px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; background: rgba(147,83,211,0.2); color: #D2B4FF;">{{q.memberLabel}}</span>
                <span style="flex: 1;"></span>
                <span style="flex-shrink: 0; font-size: 11px; color: {{q.whenColor}};">{{q.when}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="ms-clamp1" style="flex: 1; min-width: 0; font-size: 13px; font-weight: {{q.previewWeight}}; color: {{q.previewColor}};">{{q.preview}}</span>
                <sc-if value="{{q.hasUnread}}" hint-placeholder-val="{{false}}">
                  <span style="flex-shrink: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #006FEE; color: #FFFFFF; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{q.unreadCount}}</span>
                </sc-if>
              </div>
            </div>
          </button>
        </sc-for>
      </sc-if>
      <sc-if value="{{showRowsHeader}}" hint-placeholder-val="{{false}}">
        <div style="padding: 16px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #71717A;">Conversas</div>
      </sc-if>
      <sc-if value="{{noRows}}" hint-placeholder-val="{{false}}">
        <div style="padding: 48px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <span style="width: 54px; height: 54px; border-radius: 16px; background: #18181B; display: flex; align-items: center; justify-content: center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7Z"></path></svg>
          </span>
          <div style="font-size: 15px; font-weight: 700;">{{emptyTitle}}</div>
          <div style="font-size: 12.5px; line-height: 1.5; color: #71717A;">{{emptyText}}</div>
        </div>
      </sc-if>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <button type="button" onClick="{{r.onOpen}}" style="width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid rgba(255,255,255,0.06); background: transparent; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px;">
          <div style="position: relative; flex-shrink: 0; width: 48px; height: 48px;">
            <sc-if value="{{r.is24}}" hint-placeholder-val="{{true}}">
              <svg width="48" height="48" viewBox="0 0 24 24" shape-rendering="crispEdges" style="display: block; border-radius: 13px;">
                <rect x="0" y="0" width="24" height="24" fill="{{r.pix.bg}}"></rect>
                <rect x="4" y="2" width="16" height="8" fill="{{r.pix.body}}"></rect>
                <rect x="0" y="6" width="4" height="10" fill="{{r.pix.body}}"></rect>
                <rect x="20" y="6" width="4" height="10" fill="{{r.pix.body}}"></rect>
                <rect x="6" y="8" width="12" height="10" fill="{{r.pix.body}}"></rect>
                <rect x="8" y="12" width="3" height="3" fill="{{r.pix.accent}}"></rect>
                <rect x="13" y="12" width="3" height="3" fill="{{r.pix.accent}}"></rect>
                <rect x="9" y="17" width="6" height="2" fill="{{r.pix.accent}}"></rect>
              <image href="{{r.avUri}}" x="0" y="0" width="24" height="24"></image></svg>
            </sc-if>
            <sc-if value="{{r.is8}}" hint-placeholder-val="{{false}}">
              <svg width="48" height="48" viewBox="0 0 8 8" shape-rendering="crispEdges" style="display: block; border-radius: 13px;">
                <rect width="8" height="8" fill="{{r.av.bg}}"></rect><rect x="1" y="1" width="6" height="6" fill="{{r.av.body}}"></rect><rect x="1" y="1" width="1" height="1" fill="{{r.av.bg}}"></rect><rect x="6" y="6" width="1" height="1" fill="{{r.av.bg}}"></rect><rect x="2.5" y="3.5" width="1" height="1" fill="{{r.av.light}}"></rect><rect x="4.5" y="3.5" width="1" height="1" fill="{{r.av.light}}"></rect><rect x="3" y="5.5" width="2" height="0.6" fill="{{r.av.bg}}"></rect><rect x="3.5" y="0" width="1" height="1" fill="{{r.av.light}}"></rect>
              <image href="{{r.avUri}}" x="0" y="0" width="8" height="8"></image></svg>
            </sc-if>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span class="ms-clamp1" style="font-size: 14.5px; font-weight: {{r.nameWeight}}; min-width: 0;">{{r.name}}</span>
              <span style="flex-shrink: 0; height: 17px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; background: {{r.kindBg}}; color: {{r.kindColor}};">{{r.kindLabel}}</span>
              <span style="flex: 1;"></span>
              <span style="flex-shrink: 0; font-size: 11px; color: {{r.whenColor}};">{{r.when}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="ms-clamp1" style="flex: 1; min-width: 0; font-size: 13px; font-weight: {{r.previewWeight}}; color: {{r.previewColor}};">{{r.preview}}</span>
              <sc-if value="{{r.hasUnread}}" hint-placeholder-val="{{false}}">
                <span style="flex-shrink: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #006FEE; color: #FFFFFF; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{r.unreadCount}}</span>
              </sc-if>
            </div>
          </div>
        </button>
      </sc-for>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"conversations":{"editor":null},"squads":{"editor":null},"starters":{"editor":null},"back":{"editor":null},"initialFilter":{"editor":null},"$preview":{"width":390,"height":776}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: props.initialFilter || 'todas' };
  }

  renderVals() {
    const all = this.props.conversations || [];
    const filter = this.state.filter;
    const matches = all.filter((c) => c.kind === 'match');
    const friends = all.filter((c) => c.kind === 'friend');
    const squads = (this.props.squads || []).map((q) => Object.assign({}, q, {
      nameWeight: q.hasUnread ? 700 : 600,
      previewWeight: q.hasUnread ? 600 : 500,
      previewColor: q.hasUnread ? '#ECEDEE' : '#A1A1AA',
      whenColor: q.hasUnread ? '#8FC7FF' : '#71717A',
      memberLabel: 'Squad · ' + q.memberCount
    }));
    const rows = filter === 'squads' ? [] : (filter === 'amigos' ? friends : (filter === 'matches' ? matches : all));
    const showSquads = (filter === 'todas' || filter === 'squads') && squads.length > 0;
    const visible = (showSquads ? squads.length : 0) + rows.length;
    const unreadTotal = all.reduce((n, c) => n + (c.hasUnread ? 1 : 0), 0) + squads.reduce((n, q) => n + (q.hasUnread ? 1 : 0), 0);
    const chip = (id, label, count) => ({
      label: label, count: count,
      style: 'flex-shrink: 0; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid ' + (filter === id ? '#006FEE' : 'rgba(255,255,255,0.12)') + '; background: ' + (filter === id ? 'rgba(0,111,238,0.18)' : '#18181B') + '; color: ' + (filter === id ? '#8FC7FF' : '#D4D4D8') + ';',
      onClick: () => this.setState({ filter: id })
    });
    const starters = this.props.starters || [];
    const empties = {
      todas: ['Nenhuma conversa ainda', 'Escolha um amigo acima ou forme um Duo com alguém para começar.'],
      amigos: ['Nenhuma conversa com amigos', 'Toque em um amigo acima para mandar a primeira mensagem.'],
      matches: ['Nenhuma conversa de Duo', 'Quando você formar um Duo com alguém, a conversa aparece aqui.'],
      squads: ['Nenhum squad ainda', 'Entre em um squad na aba Jogar para conversar com o grupo.']
    };
    return {
      goBack: () => { if (this.props.back) this.props.back(); },
      summary: unreadTotal === 0 ? 'Tudo em dia' : (unreadTotal === 1 ? '1 conversa não lida' : unreadTotal + ' conversas não lidas'),
      hasStarters: starters.length > 0,
      starters: starters,
      filterChips: [chip('todas', 'Todas', all.length + squads.length), chip('amigos', 'Amigos', friends.length), chip('matches', 'Duos', matches.length), chip('squads', 'Squads', squads.length)],
      showSquads: showSquads,
      squadRows: squads,
      showRowsHeader: showSquads && rows.length > 0,
      rows: rows.map((c) => Object.assign({}, c, {
        nameWeight: c.hasUnread ? 700 : 600,
        previewWeight: c.hasUnread ? 600 : 500,
        previewColor: c.hasUnread ? '#ECEDEE' : '#A1A1AA',
        whenColor: c.hasUnread ? '#8FC7FF' : '#71717A',
        kindBg: c.kind === 'match' ? 'rgba(224,68,123,0.16)' : 'rgba(0,111,238,0.16)',
        kindColor: c.kind === 'match' ? '#F38CB0' : '#8FC7FF'
      })),
      noRows: visible === 0,
      emptyTitle: empties[filter][0],
      emptyText: empties[filter][1]
    };
  }
}
</script>
</body>
</html>
