<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Avaliar jogador</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  body{margin:0;background:#000000;color:#ECEDEE;font-family:'Manrope','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .ap-root{position:relative;width:390px;height:776px;background:#000000;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;}
  .ap-root *{box-sizing:border-box;}
  .ap-root button{font-family:'Manrope','Segoe UI',system-ui,sans-serif;}
  .ap-head{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.08);flex:none;}
  .ap-back{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:#212124;color:#D4D4D8;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none;}
  .ap-title{font-family:'Space Grotesk','Segoe UI',sans-serif;font-size:19px;font-weight:700;}
  .ap-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
  .ap-row{background:#18181B;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;}
  .ap-rh{display:flex;align-items:center;gap:11px;}
  .ap-ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;}
  .ap-label{font-size:14px;font-weight:700;}
  .ap-hint{font-size:11.5px;color:#71717A;margin-top:2px;}
  .ap-level{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .ap-icons{display:flex;gap:10px;}
  .ap-pick{flex:1;height:48px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:#212124;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .ap-group{background:#18181B;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;}
  .ap-chips{display:flex;gap:7px;flex-wrap:wrap;}
  .ap-chip{font-family:'Manrope',sans-serif;display:inline-flex;align-items:center;padding:8px 13px;border-radius:999px;background:#212124;border:1px solid rgba(255,255,255,0.08);color:#D4D4D8;font-size:12.5px;font-weight:600;cursor:pointer;}
  .ap-chip.on{background:rgba(0,111,238,0.16);border-color:rgba(0,111,238,.4);color:#8FC7FF;}
  .ap-field{width:100%;background:#212124;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:11px 13px;color:#ECEDEE;font-family:'Manrope',sans-serif;font-size:13px;resize:none;line-height:1.5;}
  .ap-foot{flex:none;padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,0.08);}
  .ap-submit{width:100%;height:50px;border-radius:14px;border:none;font-size:14.5px;font-weight:800;}
</style>
</helmet>

<div class="ap-root">
  <div class="ap-head">
    <button type="button" class="ap-back" onClick="{{goBack}}" aria-label="Voltar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div class="ap-title">Avaliar jogador</div>
  </div>

  <div class="ap-body">
    <div style="display:flex;align-items:center;gap:12px;">
      <sc-if value="{{p.is8}}" hint-placeholder-val="{{true}}">
        <svg width="52" height="52" viewBox="0 0 8 8" shape-rendering="crispEdges" style="flex:none;display:block;border-radius:22%;">
          <rect width="8" height="8" fill="{{p.bg}}"></rect><rect x="1" y="1" width="6" height="6" fill="{{p.body}}"></rect><rect x="1" y="1" width="1" height="1" fill="{{p.bg}}"></rect><rect x="6" y="6" width="1" height="1" fill="{{p.bg}}"></rect><rect x="2.5" y="3.5" width="1" height="1" fill="{{p.light}}"></rect><rect x="4.5" y="3.5" width="1" height="1" fill="{{p.light}}"></rect><rect x="3" y="5.5" width="2" height="0.6" fill="{{p.bg}}"></rect><rect x="3.5" y="0" width="1" height="1" fill="{{p.light}}"></rect>
        <image href="{{p.avUri}}" x="0" y="0" width="8" height="8"></image></svg>
      </sc-if>
      <sc-if value="{{p.is24}}" hint-placeholder-val="{{false}}">
        <svg width="52" height="52" viewBox="0 0 24 24" shape-rendering="crispEdges" style="flex:none;display:block;border-radius:12px;">
          <rect x="0" y="0" width="24" height="24" fill="{{p.pix.bg}}"></rect>
          <rect x="4" y="2" width="16" height="8" fill="{{p.pix.body}}"></rect>
          <rect x="0" y="6" width="4" height="10" fill="{{p.pix.body}}"></rect>
          <rect x="20" y="6" width="4" height="10" fill="{{p.pix.body}}"></rect>
          <rect x="6" y="8" width="12" height="10" fill="{{p.pix.body}}"></rect>
          <rect x="8" y="12" width="3" height="3" fill="{{p.pix.accent}}"></rect>
          <rect x="13" y="12" width="3" height="3" fill="{{p.pix.accent}}"></rect>
          <rect x="9" y="17" width="6" height="2" fill="{{p.pix.accent}}"></rect>
        <image href="{{p.avUri}}" x="0" y="0" width="24" height="24"></image></svg>
      </sc-if>
      <div style="min-width:0;">
        <div style="font-size:15px;font-weight:700;">{{introTitle}}</div>
        <div style="font-size:12.5px;color:#A1A1AA;margin-top:3px;line-height:1.45;">Suas notas entram na reputação do perfil. Toque nos ícones para dar de 1 a 3.</div>
      </div>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div class="ap-row">
        <div class="ap-rh">
          <div class="ap-ico" style="background: {{r.soft}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{r.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></div>
          <div style="min-width:0;"><div class="ap-label">{{r.label}}</div><div class="ap-hint">{{r.hint}}</div></div>
          <span class="ap-level" style="color: {{r.levelColor}}">{{r.levelLabel}}</span>
        </div>
        <div class="ap-icons">
          <sc-for list="{{r.icons}}" as="i" hint-placeholder-count="3">
            <button type="button" class="ap-pick" aria-label="{{i.label}}" onClick="{{i.onPick}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{i.fill}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.icon}}"></path></svg></button>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div class="ap-group">
      <div style="font-size:13px;font-weight:700;">Qual jogo vocês jogaram? <span style="color:#71717A;font-weight:500;">(opcional)</span></div>
      <div class="ap-chips">
        <sc-for list="{{gameChips}}" as="c" hint-placeholder-count="3">
          <button type="button" class="{{c.cls}}" onClick="{{c.onClick}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div class="ap-group">
      <label for="ap-comment" style="font-size:13px;font-weight:700;">Deixe um depoimento <span style="color:#71717A;font-weight:500;">(opcional)</span></label>
      <textarea id="ap-comment" class="ap-field" rows="3" placeholder="Ex.: ótima companhia de mesa, explicou tudo com calma." value="{{comment}}" onInput="{{onComment}}"></textarea>
      <div style="text-align:right;font-size:11.5px;color:#71717A;">{{commentCount}}/140</div>
    </div>
  </div>

  <div class="ap-foot">
    <button type="button" class="ap-submit" onClick="{{doSubmit}}" style="{{ctaStyle}}">{{ctaLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"person":{"editor":null},"initial":{"editor":null},"submit":{"editor":null},"back":{"editor":null},"$preview":{"width":390,"height":776}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const init = props.initial;
    this.state = { draft: init ? Object.assign({ comment: '', game: '' }, init) : { carry: 0, chill: 0, rage: 0, again: 0, comment: '', game: '' } };
  }

  setDraft = (patch) => this.setState((prev) => ({ draft: Object.assign({}, prev.draft, patch) }));

  renderVals() {
    const d = this.state.draft;
    const person = this.props.person || { id: '', name: 'Jogador', games: [], common: [], matched: false };
    const hexSoft = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const defs = [
      { key: 'carry', label: 'Carry', hint: 'Levou o time nas costas', color: '#F5A524', icon: "M8 21l8 0 M12 17l0 4 M7 4l10 0 M17 4v8a5 5 0 0 1 -10 0v-8 M5 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0 M19 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" },
      { key: 'chill', label: 'Chill', hint: 'Boa companhia, sem tensão', color: '#22D3EE', icon: "M3 14c.83 .642 2.077 1.017 3.5 1c1.423 .017 2.67 -.358 3.5 -1c.83 -.642 2.077 -1.017 3.5 -1c1.423 -.017 2.67 .358 3.5 1 M8 3a2.4 2.4 0 0 0 -1 2a2.4 2.4 0 0 0 1 2 M12 3a2.4 2.4 0 0 0 -1 2a2.4 2.4 0 0 0 1 2 M3 10h14v5a6 6 0 0 1 -6 6h-2a6 6 0 0 1 -6 -6v-5z M16.746 16.726a3 3 0 1 0 .252 -5.555" },
      { key: 'rage', label: 'Rage quit', hint: 'Se irritou ou abandonou a partida', color: '#FF3B30', icon: "M12 12c2 -2.96 0 -7 -1 -8c0 3.038 -1.773 4.741 -3 6c-1.226 1.26 -2 3.24 -2 5a6 6 0 1 0 12 0c0 -1.532 -1.056 -3.94 -2 -5c-1.786 3 -2.791 3 -4 2z" },
      { key: 'again', label: 'Jogaria de novo', hint: 'Toparia jogar outra vez', color: '#E0447B', icon: "M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572" }
    ];
    const rows = defs.map((def) => {
      const lvl = d[def.key];
      return {
        label: def.label, hint: def.hint, color: def.color, icon: def.icon, soft: hexSoft(def.color, 0.16),
        levelLabel: lvl ? ['Um pouco', 'Bastante', 'Demais'][lvl - 1] : 'Toque para avaliar',
        levelColor: lvl ? def.color : '#71717A',
        icons: [1, 2, 3].map((n) => ({ label: def.label + ' nível ' + n, icon: def.icon, fill: n <= lvl ? def.color : '#3F3F46', onPick: () => this.setDraft({ [def.key]: lvl === n ? n - 1 : n }) }))
      };
    });
    const opts = ((person.common && person.common.length) ? person.common : (person.games || []).slice(0, 3)).concat(['Outro']);
    const gameChips = opts.map((label) => ({ label: label, cls: 'ap-chip' + (d.game === label ? ' on' : ''), onClick: () => this.setDraft({ game: d.game === label ? '' : label }) }));
    const valid = !!(d.carry || d.chill || d.rage || d.again);

    return {
      p: Object.assign({ bg: '#000', body: '#000', light: '#000', pix: null }, person, { avUri: (this.props.avatars || {})[person.handle] || '', is24: !!person.pix24, is8: !person.pix24, pix: person.pix24 || { bg: '#000', body: '#000', accent: '#000' } }),
      introTitle: (person.matched ? 'Como foi jogar com ' : 'Como é jogar com ') + person.name + '?',
      rows: rows,
      gameChips: gameChips,
      comment: d.comment,
      onComment: (e) => this.setDraft({ comment: e.target.value.slice(0, 140) }),
      commentCount: (d.comment || '').length,
      goBack: () => { if (this.props.back) this.props.back(); },
      doSubmit: () => { if (valid && this.props.submit) this.props.submit(Object.assign({}, d)); },
      ctaLabel: valid ? 'Enviar avaliação' : 'Dê pelo menos uma nota',
      ctaStyle: valid ? 'background:#006FEE;color:#FFFFFF;cursor:pointer;' : 'background:#27272A;color:#71717A;cursor:default;'
    };
  }
}
</script>
</body>
</html>
